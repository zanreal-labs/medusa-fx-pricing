name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec medusa lint src

      - name: Typecheck (backend)
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Typecheck (admin)
        run: pnpm exec tsc --noEmit -p src/admin/tsconfig.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
